[project]
name = "smartcompare-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Ahmed",email = "kingzatel@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.109.0)",
    "uvicorn[standard] (>=0.27.0)",
    "openai (>=1.12.0)",
    "httpx (>=0.26.0)",
    "supabase (>=2.3.0)",
    "redis (>=5.0.0)",
    "pydantic (>=2.5.0)",
    "pydantic-settings (>=2.1.0)",
    "python-dotenv (>=1.0.0)",
    "python-multipart (>=0.0.6)",
    "email-validator (>=2.0.0)",
    "upstash-redis (>=1.0.0)",
    "beautifulsoup4 (>=4.12.0)",
    "lxml (>=5.0.0)",
    "curl-cffi (>=0.7.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "black (>=26.1.0,<27.0.0)"
]

[tool.pytest.ini_options]
markers = [
    "live_db: tests requiring live Supabase bahrain_approved_drugs table",
    "integration: tests calling live Railway production API",
    "live_unit: unit tests that call live external services (iHerb, Serper, OpenAI)",
    "bench: latency/throughput benchmarks against live Railway (gated by BENCH=1 env)",
]

[tool.poetry]
package-mode = false