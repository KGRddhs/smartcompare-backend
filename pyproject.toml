[project]
name = "smartcompare-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Ahmed",email = "kingzatel@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.109.0)",
    "uvicorn[standard] (>=0.27.0)",
    "openai (>=1.12.0)",
    "httpx (>=0.26.0)",
    "supabase (>=2.3.0)",
    "redis (>=5.0.0)",
    "pydantic (>=2.5.0)",
    "pydantic-settings (>=2.1.0)",
    "python-dotenv (>=1.0.0)",
    "python-multipart (>=0.0.6)",
    "email-validator (>=2.0.0)",
    "upstash-redis (>=1.0.0)",
    "beautifulsoup4 (>=4.12.0)",
    "lxml (>=5.0.0)",
    "curl-cffi (>=0.7.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "black (>=26.1.0,<27.0.0)"
]

[tool.pytest.ini_options]
markers = [
    "live_db: tests requiring live Supabase bahrain_approved_drugs table",
    "integration: tests calling live Railway production API",
    "live_unit: unit tests that call live external services (iHerb, Serper, OpenAI)",
    "bench: latency/throughput benchmarks against live Railway (gated by BENCH=1 env)",
    "live_prod: live tests whose HTTP target is the PRODUCTION deployment (web-production-58776) or the production Supabase L2 — they make the prod server write to the production price cache and L2 price rows, so the scheduled .github/workflows/live-suite.yml run excludes them via -m \"live_unit and not live_prod\" (#49)",
]

[tool.poetry]
package-mode = false

# Ruff (Step 2, Synack orchestrator). The BLOCKING tier is passed on the CLI
# (--select E9,F63,F7,F82) by .githooks/pre-commit and CI, so this config can
# carry the fuller REPORT-ONLY ruleset for local `ruff check` runs.
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["backend", ".venv-scrape", "_proof", "temp_uploads", "SmartCompareApp", "cloudflare-workers", "landing"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "SIM"]
# The legacy tree predates the linter; these rules would drown the signal today.
ignore = ["E501", "E402", "SIM105", "SIM108"]