name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # black is installed here too, pinned to the SAME version as backend-lint:
      # tests/test_ci_gates.py::test_black_allowlist_entries_are_actually_clean is
      # `pytest.importorskip("black")`, so without this the guard that stops a dirty
      # path being added to the ratchet silently SKIPPED in CI.
      # pytest-cov: see the coverage flags on the `Run unit tests` step below.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      # Seed each check from the committed lock first: uv preserves already-pinned
      # versions unless requirements*.in demands otherwise, so this fails only when
      # someone edits a .in without recompiling — NOT every time a dep publishes.
      - name: Lock is current
        run: |
          pip install uv
          cp requirements.txt /tmp/requirements.check.txt
          cp requirements-dev.txt /tmp/requirements-dev.check.txt
          uv pip compile requirements.in -o /tmp/requirements.check.txt \
            --universal --python-version 3.12 --quiet
          uv pip compile requirements-dev.in -o /tmp/requirements-dev.check.txt \
            -c requirements.txt --universal --python-version 3.12 --quiet
          # Compare package lines only — uv's header records the output path, which
          # differs between the committed file and the /tmp check copy.
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.check.txt) \
            || { echo "::error::requirements.txt is stale — run: uv pip compile requirements.in -o requirements.txt --universal --python-version 3.12"; exit 1; }
          diff -u <(grep -v '^#' requirements-dev.txt) <(grep -v '^#' /tmp/requirements-dev.check.txt) \
            || { echo "::error::requirements-dev.txt is stale — run: uv pip compile requirements-dev.in -o requirements-dev.txt --universal --python-version 3.12"; exit 1; }

      - name: Syntax check all Python files
        run: |
          find app -name "*.py" -exec python -m py_compile {} +
          echo "All Python files pass syntax check"

      # -rxX surfaces the xfail/xpass summary. tests/test_value_math.py carries a
      # module-level xfail for its 35 RED-by-design Bundle C v1.1 stubs; -rX makes
      # it loud the day they start XPASSing (i.e. the implementation landed and the
      # marker should come off). Marker selection is deliberately unchanged — #49
      # keeps live_unit/live_db/integration out of the PR gate.
      #
      # COVERAGE (issue #49 section C). --cov-report=term-missing puts the number in
      # every run log; --cov-fail-under makes it a real floor, so a coverage collapse
      # cannot merge green.
      #
      # RATCHETED 2026-08-25: the first green CI run on main measured 84.85%
      # (20,032 statements / 3,035 missed), so the placeholder 60 was raised to 83.
      # One point of margin is deliberate — coverage moves slightly run to run, and a
      # floor that reddens the build on noise is the exact failure mode #49 exists to
      # end. Raise it again when the 15 failures in #89 are fixed and the number moves.
      #
      # HOW THE FLOOR WAS SET, and why it sits deliberately below the measurement.
      # MEASURED 2026-08-25: 78% (19,825 statements, 4,363 missed) over this exact
      # marker selection, run locally as 12 chunks of tests/test_*.py with the
      # network-hanging adapter files excluded and the results `coverage combine`d
      # (8,505 passed / 20 failed — the documented pre-existing set).
      # GitHub Actions cannot be executed from the dev machine, and the runner is
      # NOT the same environment: it has no .env, so credential-gated branches take
      # different paths and roughly 150 more tests error there than here. The CI
      # percentage will therefore be lower than 78 by an amount that cannot be known
      # until CI runs. Setting the floor at the local measurement would turn the
      # BLOCKING backend-tests job red on day one, which is exactly the failure mode
      # issue #49 exists to end.
      # So: 60 — about 18 points of margin below the measurement. It can only fire
      # on a real collapse, never on that environment delta.
      # RATCHET IT UP to the observed CI percentage (rounded down) after the first
      # green run on main — that number is the one the acceptance criterion asks
      # for, and it can only be read off CI itself.
      # M18 (M13-71): backend-tests is GREEN AND MEANINGFUL — the committed
      # 14-node baseline (tests/.pre_impl_failures.txt, the SAME file the local
      # regression gate reads) is deselected here, derived at run time so the
      # file stays the single source. A NEW failure still reddens the job.
      # To retire a baseline node: fix it, then re-capture the file (see its
      # header) — never hand-add a --deselect below.
      # tests/test_ci_gates.py pins this step's coupling to the baseline file.
      - name: Run unit tests
        run: |
          DESELECT=$(grep -vE '^\s*(#|$)' tests/.pre_impl_failures.txt | sed 's/^/--deselect=/' | tr '\n' ' ')
          python -m pytest tests/ -v \
            -m "not (live_unit or live_db or integration)" \
            --ignore=tests/test_integration.py \
            --timeout=60 \
            -rxX \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=83 \
            --tb=short \
            $DESELECT

  # NOT AUTOMATICALLY REQUIRED. Adding a job to this file does not make it a
  # required status check: until branch protection on `main` lists
  # `backend-lint` (and `backend-tests`) under "Require status checks to pass",
  # the BLOCKING black step below only fails its own job and a PR can still be
  # merged red. Flipping that setting is a repo-admin action, not a code change
  # — it is called out in the #49 PR description.
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Pinned EXACTLY, not to the pyproject range: `black>=26.1.0,<27.0.0` resolves to
      # whatever 26.x shipped that morning, so a point release that changes formatting
      # would turn this BLOCKING step red on a day with no code change. 26.5.1 is the
      # version .github/black-clean-paths.txt was measured against.
      # TODO(#46): move the pin into the compiled dev lock when requirements-dev.txt
      # lands, so it is maintained in one place instead of three.
      - name: Install black
        run: pip install "black==26.5.1"

      # BLOCKING. Ruff bug-class tier only — E9 (syntax), F63 (literal-comparison
      # misuse), F7 (syntax-adjacent statement errors), F82 (undefined names).
      # Measured clean repo-wide at 4c7abf6, so it gates from day one without an
      # allowlist. The fuller [tool.ruff.lint] ruleset stays report-only/local.
      # Pinned EXACTLY for the same reason black is (a point release must not
      # redden a no-change day); the dev lock carries the same pin.
      - name: Install ruff
        run: pip install "ruff==0.16.5"

      - name: ruff (blocking bug-class tier)
        run: ruff check --select E9,F63,F7,F82 --no-cache app/ scripts/ tests/

      # BLOCKING. Scoped to .github/black-clean-paths.txt — the ratchet of files
      # that are black-clean today. See that file for why the gate is not repo-wide.
      - name: black --check (clean-paths allowlist)
        run: |
          grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' .github/black-clean-paths.txt \
            | tr -d '\r' \
            | xargs -r python -m black --check --diff

      # REPORTING ONLY. 603 of 619 files under app/ tests/ scripts/ drift from black
      # at c630436, so this cannot gate a PR without a ~600-file reformat commit that
      # #49 puts out of scope. It stays here so the number is measured on every run
      # and visibly shrinks as files graduate onto the allowlist above.
      - name: black --check (whole repo, drift report)
        continue-on-error: true
        run: |
          echo "Baseline at main c630436: 603 of 619 files. MEASURED 2026-09-01: 701 of 719."
          echo "This step never blocks a PR — see .github/black-clean-paths.txt."
          python -m black --check app/ tests/ scripts/

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SmartCompareApp/package-lock.json

      # NON-BLOCKING on purpose, twice over:
      # BLOCKING since #120. Both original reasons for the blindfold are spent:
      # requirements.txt is now a COMPILED lock (#46 landed; the `Lock is current`
      # step above re-compiles and diffs it), so a red run is reproducible; and the
      # current state is not "untriaged" — the 2026-09-01 run measured
      # `No known vulnerabilities found`. A new advisory should now stop a merge.
      - name: pip-audit (Python dependencies)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      # STAYS NON-BLOCKING — and this is the one blindfold in this file that hides a
      # REAL failure. MEASURED on the 2026-09-01 main run: exit 1 with
      # `43 vulnerabilities (1 low, 20 moderate, 21 high, 1 critical)` — worse than
      # the 1-critical/20-high the M13 review recorded, so it is drifting upward.
      # Un-blinding it today would simply block every merge, so the honest sequence
      # is: bump the direct offenders (axios is the one that ships to devices), then
      # convert this to a "no NEW advisories vs a checked-in baseline" gate. Until
      # then CLAUDE.md must NOT claim `npm audit --audit-level=high` is clean.
      - name: npm audit (SmartCompareApp)
        continue-on-error: true
        run: cd SmartCompareApp && npm audit --audit-level=high

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SmartCompareApp/package-lock.json

      - name: Install frontend dependencies
        run: cd SmartCompareApp && npm ci

      # BLOCKING since #120. The "7 pre-existing TS errors" this used to excuse are
      # gone: the 2026-09-01 main run type-checks CLEAN (0 errors), and the same
      # command already runs BLOCKING inside frontend-tests. Leaving it blind here
      # was the worse half of the problem, because THIS job is one of the three
      # branch-protection requires — so the merge gate required a job that could
      # not fail.
      - name: TypeScript type check
        run: cd SmartCompareApp && npx tsc --noEmit

  # The FIRST blocking-capable automated gate the frontend has ever had. Before
  # this job, the Jest suite (135-235 specs), the eslint i18n fence and tsc were
  # all decorative — nothing ran them in CI, which is why the M13 review's
  # frontend lane was a prediction fulfilled. It runs the M13-15 i18n
  # referenced-key fence, the M13-14 hook test and the M13-13/M13-54 screen
  # tests among the full suite.
  #
  # RATCHETED TO BLOCKING 2026-09-01 (M18). The job landed non-blocking with
  # continue-on-error on each check step, purely to MEASURE a red count that
  # could not be read locally (node_modules is absent from the dev tree). The
  # first run on main 593ec1e measured it:
  #     jest    2103 passed / 0 failed
  #     tsc     0 errors
  #     eslint  8 errors / 143 warnings  — all 8 i18next/no-literal-string
  # The 8 ESLint errors were fixed in the same wave, so all three checks are
  # green and each continue-on-error is now removed. This is the first
  # BLOCKING frontend gate the repo has ever had.
  #
  # The 143 ESLint WARNINGS do not block and are not meant to: eslint exits 0
  # with warnings and 1 only on errors, so the warning backlog can be drained
  # incrementally without a red build. Tighten it later with --max-warnings=N
  # ratcheted downward, the way .github/black-clean-paths.txt works — do NOT
  # re-add continue-on-error to do it.
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SmartCompareApp/package-lock.json

      - name: Install frontend dependencies
        run: cd SmartCompareApp && npm ci

      # BLOCKING since M18 — measured 2103 passed / 0 failed on main 593ec1e.
      - name: Jest (unit suite + i18n/console fences)
        run: cd SmartCompareApp && npx jest --ci

      # BLOCKING since M18 — measured 0 errors / 143 warnings after the 8
      # i18next/no-literal-string errors were translated. eslint exits 0 on
      # warnings, so the backlog reports without blocking.
      - name: ESLint (src)
        run: cd SmartCompareApp && npx eslint "src/**/*.{ts,tsx}"

      # BLOCKING since M18 — measured 0 errors on main 593ec1e.
      - name: TypeScript type check
        run: cd SmartCompareApp && npx tsc --noEmit

  # CHANNEL FRESHNESS (W3-13, MB-RECONCILE-06). Phones run whatever `eas update`
  # last published to the `preview` channel — merging to main ships NOTHING to a
  # device (CLAUDE.md "Two-lever launch model"). Measured 2026-09-11 at ed75dc70:
  # the channel ran 97b5f15, 33 first-parent commits (28 merges + 5 direct
  # pushes) / 311 files behind main, and CI was green. That is a DATED
  # measurement, not a live claim — it grows with every merge, and no test
  # asserts it. This job resolves the channel's published commit and fails when
  # it is more than ONE first-parent commit behind origin/main. First-parent,
  # not merges: five of those 33 were direct pushes, and a merge count would let
  # a direct-push regression through.
  #
  # NOT A REQUIRED CHECK and NON-BLOCKING until 2026-09-18: the check step carries
  # `continue-on-error: true`. The precedent is this file's own frontend-tests
  # block (see the comment at the `frontend-tests:` job): it landed non-blocking
  # on each check step purely to MEASURE a red count that could not be read
  # locally, then was ratcheted to blocking once measured. The "do NOT re-add
  # continue-on-error to do it" sentence in that same comment is about draining
  # the ESLint WARNING backlog on an already-green check — it is not a repo-wide
  # prohibition, so do not delete this line on the strength of it.
  # tests/test_ci_gates.py pins the non-blocking state; flip the pin in the same
  # PR that flips the line.
  #
  # ⚠ FLIP PRECONDITION — read before deleting `continue-on-error`. This job runs
  # on every PR (the workflow triggers on pull_request AND push to main), but its
  # verdict is a property of the CHANNEL, not of the PR — and merging anything to
  # main makes it worse, while the only cure (`eas update`, which needs an
  # interactive `eas login`) is outside CI. The moment `continue-on-error` is
  # deleted and `channel-freshness` is added to branch protection, NO CONTRIBUTOR
  # CAN MERGE ANYTHING until an OTA is published — including the PR that would fix
  # an outage. That is a self-inflicted merge freeze. So the flip PR must, in the
  # same change, either add `if: github.event_name == 'push'` at job level (the
  # `github` context IS available in a job-level `if`, and it also removes the
  # per-PR `npm ci` + two `npx` downloads) or land an equivalent documented
  # break-glass; and the flip is additionally conditional on the OTA having
  # landed, so the first blocking run is green. While it is non-blocking the job
  # keeps both triggers, because a per-PR reading is free data and harmless.
  #
  # SKIPS CLEANLY WITHOUT THE SECRET. `secrets.*` cannot be read from an `if`
  # (docs.github.com "Using secrets in a workflow"), and a job-level `if` sees
  # neither `secrets` nor `env` (contexts reference: job-level keys see
  # github/needs/strategy/matrix/vars/inputs; step-level keys additionally see
  # job/runner/env/secrets/steps). So a job-level env var DERIVED from the secret
  # gates every step after checkout — the documented "Run a step if a secret has
  # been set" pattern, with one hardening: the job-level value is a BOOLEAN, and
  # the raw token is scoped to the single eas-cli step so it is never in the
  # environment of `npm ci` and its postinstall scripts. Until Ahmed adds the
  # EXPO_TOKEN repository secret (an Expo access token,
  # docs.expo.dev/accounts/programmatic-access) the job prints a notice and
  # passes; every fork PR takes the same path, because secrets are not passed to
  # fork PRs.
  #
  # FALLBACK IF THE BOOLEAN DOES NOT EVALUATE. The composition
  # `${{ secrets.EXPO_TOKEN != '' }}` at job level is two documented facts put
  # together, not itself a documented example. If the first armed run shows the
  # skip step running despite the secret (or the resolve step running without
  # it), replace this job-level boolean with the documented verbatim form
  # (`EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}` at job env, steps gated on
  # `env.EXPO_TOKEN != ''`) and delete the token-scoping assertion in
  # tests/test_ci_gates.py in the same PR. The two step conditions are
  # complementary and exhaustive, so the job always runs one branch and always
  # exits green — it fails safe; the skip notice therefore PRINTS the observed
  # value, so "skipped" can never be mistaken for "measured".
  #
  # WHY TWO eas COMMANDS: at eas-cli 18.8.1 `update:list --json` emits group id,
  # runtimeVersion, platforms, message — but NOT the git commit; only
  # `update:view <group> --json` carries `gitCommitHash` (one entry per
  # platform), and eas-cli's JSON sanitizer omits null keys, so an unhashed
  # publish has no key at all (script exit 2). `--limit 1` + index 0 is eas-cli's
  # own convention for "latest" (build/update/queries.js fetches the latest group
  # with limit 1 / offset 0; build/update/utils.js:170 reads `updates[0]`;
  # build/project/publish.js:433 labels `updates[0]` the current update) — the
  # first armed run confirms it, which is why the script prints the view JSON's
  # `createdAt`. eas-cli is pinned to the exact version those JSON shapes were
  # read on; `npx --yes eas-cli@18.8.1` resolves because eas-cli declares a
  # single bin (`{"eas": "./bin/run"}`) and is NOT a dependency of
  # SmartCompareApp/package.json, so no local copy shadows the pin. eas.json
  # requires >= 18.8.1 (enforced by applyCliConfigAsync) and eas-cli requires
  # node >= 20.
  #
  # DO NOT ADD `--non-interactive` TO `update:view`. It has no such flag at
  # 18.8.1 (it spreads EasJsonOnlyFlag, which is `{json}` alone; `update:list`
  # spreads EasNonInteractiveAndJsonFlags) — adding one for symmetry turns the
  # armed job into an oclif "nonexistent flag" error that no test can see.
  # Nothing is lost: Actions sets CI=true, which makes eas-cli non-interactive by
  # default, and `--json` implies it as well.
  channel-freshness:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN_SET: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # merge-base / rev-list need history; the default (1) has none

      - name: Skipped — EXPO_TOKEN secret not configured
        if: ${{ env.EXPO_TOKEN_SET != 'true' }}
        run: |
          echo "::notice title=channel-freshness skipped::EXPO_TOKEN_SET='${{ env.EXPO_TOKEN_SET }}' — add the EXPO_TOKEN repository secret to arm the preview-channel freshness guard; if the secret IS set, this value did not evaluate and the job needs the fallback form in the comment above."

      - uses: actions/setup-node@v4
        if: ${{ env.EXPO_TOKEN_SET == 'true' }}
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SmartCompareApp/package-lock.json

      - uses: actions/setup-python@v5
        if: ${{ env.EXPO_TOKEN_SET == 'true' }}
        with:
          python-version: '3.12'

      # eas-cli resolves the project id by spawning `npx expo config --json` in
      # the app dir whenever `expo` is a package.json dependency; install first
      # so that spawn is deterministic against the lockfile. No token here.
      - name: Install frontend dependencies
        if: ${{ env.EXPO_TOKEN_SET == 'true' }}
        run: cd SmartCompareApp && npm ci

      - name: Resolve the preview channel (eas-cli 18.8.1)
        if: ${{ env.EXPO_TOKEN_SET == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}   # the ONLY step that sees the token
        run: |
          cd SmartCompareApp
          npx --yes eas-cli@18.8.1 update:list --branch preview --limit 1 --json --non-interactive > "$RUNNER_TEMP/preview-list.json"
          GROUP=$(python -c "import json,os;t=open(os.environ['RUNNER_TEMP']+'/preview-list.json',encoding='utf-8').read();i=min(x for x in (t.find('{'),t.find('[')) if x>=0);print(json.loads(t[i:])['currentPage'][0]['group'])")
          npx --yes eas-cli@18.8.1 update:view "$GROUP" --json > "$RUNNER_TEMP/preview-group.json"

      # Exit codes: 0 fresh - 1 stale - 2 unresolvable - 3 published from a
      # commit not on main - 4 roll-back-to-embedded. No pip install: the script
      # is stdlib-only and a unit test pins that.
      - name: Preview channel is at most one first-parent commit behind main (NON-BLOCKING until 2026-09-18)
        if: ${{ env.EXPO_TOKEN_SET == 'true' }}
        continue-on-error: true
        run: |
          python scripts/check_channel_freshness.py \
            --list-json "$RUNNER_TEMP/preview-list.json" \
            --view-json "$RUNNER_TEMP/preview-group.json" \
            --main origin/main --max-behind 1
