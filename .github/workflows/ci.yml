name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Syntax check all Python files
        run: |
          find app -name "*.py" -exec python -m py_compile {} +
          echo "All Python files pass syntax check"

      # -rxX surfaces the xfail/xpass summary. tests/test_value_math.py carries a
      # module-level xfail for its 35 RED-by-design Bundle C v1.1 stubs; -rX makes
      # it loud the day they start XPASSing (i.e. the implementation landed and the
      # marker should come off). Marker selection is deliberately unchanged — #49
      # keeps live_unit/live_db/integration out of the PR gate.
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v \
            -m "not (live_unit or live_db or integration)" \
            --ignore=tests/test_integration.py \
            --timeout=60 \
            -rxX \
            --tb=short

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # TODO(#46): switch to the pinned dev lock once requirements-dev.txt lands,
      # so the formatter version is reproducible instead of "latest 26.x".
      # Range mirrors the dev group in pyproject.toml.
      - name: Install black
        run: pip install "black>=26.1.0,<27.0.0"

      # BLOCKING. Scoped to .github/black-clean-paths.txt — the ratchet of files
      # that are black-clean today. See that file for why the gate is not repo-wide.
      - name: black --check (clean-paths allowlist)
        run: |
          grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' .github/black-clean-paths.txt \
            | tr -d '\r' \
            | xargs -r python -m black --check --diff

      # REPORTING ONLY. 603 of 619 files under app/ tests/ scripts/ drift from black
      # at c630436, so this cannot gate a PR without a ~600-file reformat commit that
      # #49 puts out of scope. It stays here so the number is measured on every run
      # and visibly shrinks as files graduate onto the allowlist above.
      - name: black --check (whole repo, drift report)
        continue-on-error: true
        run: |
          echo "Baseline at main c630436: 603 of 619 files would be reformatted."
          echo "This step never blocks a PR — see .github/black-clean-paths.txt."
          python -m black --check app/ tests/ scripts/

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SmartCompareApp/package-lock.json

      # NON-BLOCKING on purpose, twice over:
      #  1. requirements.txt is a floating `>=` list, not a lock, so pip-audit here
      #     scans whatever resolved today — a red run would not be reproducible.
      #     TODO(#46): point this at the compiled lock and drop continue-on-error,
      #     which is the only version of this gate that actually means something.
      #  2. #49 installs the gate and records the current state; triaging advisories
      #     is separate work (issue #49, Out of scope).
      - name: pip-audit (Python dependencies)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      # NON-BLOCKING until the current high/critical advisory count is recorded and
      # triaged; flip to blocking (or to a "no new advisories" baseline) after that.
      - name: npm audit (SmartCompareApp)
        continue-on-error: true
        run: cd SmartCompareApp && npm audit --audit-level=high

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SmartCompareApp/package-lock.json

      - name: Install frontend dependencies
        run: cd SmartCompareApp && npm ci

      - name: TypeScript type check
        run: cd SmartCompareApp && npx tsc --noEmit
        continue-on-error: true  # 7 pre-existing TS errors
