# ============================================================================
# SCHEDULED LIVE ADAPTER SUITE — issue #49
#
# !! THIS WORKFLOW SPENDS REAL MONEY !!
#
# Every run makes live calls to real retailer sites and to paid vendors:
# Serper credits (the free tier is a finite ~2,500 one-time grant that has been
# depleted twice already), OpenAI tokens, and Firecrawl / Scrape.do / Zyte /
# Bright Data credits wherever the cascade escalates. Budget roughly one
# fan-out per `live_unit` test.
#
# Consequences of that, all enforced below:
#   * NO `pull_request` trigger and NO `push` trigger. A PR must never be able
#     to bill this. The only entry points are the weekly cron and an explicit
#     manual `workflow_dispatch`.
#   * WEEKLY, not nightly. Cost-bound per #49.
#   * The eval runner (`scripts/eval_runner`, ~600-1,000 Serper credits per full
#     run) and the `BENCH=1` perf suite are deliberately NOT wired here.
#
# WHY IT EXISTS: 21 test files carry the `live_unit` marker and the PR gate
# excludes all of them, so today a retailer changing its markup is detected by a
# user, not by us. This is the only automated channel that exercises the runtime
# adapter path against real storefronts.
#
# WHEN IT GOES RED: that is scraper drift to fix in the adapter. Never relax an
# assertion, and never weaken `should_cache_price`, `is_price_showable`, or the
# exact-identity gate to make it green (#49, Constraints). Multi-sample before
# concluding a source is dead — one unlucky sample is not a failure.
# ============================================================================
name: Live adapter suite (scheduled)

on:
  schedule:
    # Mondays 04:00 UTC — weekly, off-peak, and before the working week so a
    # drift report is waiting rather than landing mid-deploy.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual run (it spends real vendor credits)'
        required: false
        default: 'manual drift check'

# One live run at a time. Two concurrent runs would double the credit burn and
# hammer the same storefronts from the same egress IPs.
concurrency:
  group: live-suite
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # the failure reporter below opens an issue

jobs:
  live-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      # LIVE=1 is the opt-in switch owned by #48. Setting it here is
      # forward-compatible: harmless before #48 lands, load-bearing after.
      # No secret is echoed — GitHub masks them, and nothing prints os.environ.
      - name: Run the live_unit adapter suite
        env:
          LIVE: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPEDO_API_TOKEN: ${{ secrets.SCRAPEDO_API_TOKEN }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: |
          python -m pytest tests/ -v \
            -m live_unit \
            --timeout=180 \
            --tb=short

      # A silently red scheduled run is the same as no run at all: nobody looks
      # at the Actions tab on a Monday. Turn it into an issue that has to be
      # closed by a human. No new alerting secrets — GITHUB_TOKEN only.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Live adapter suite failed — likely scraper drift';
            const body = [
              'The scheduled `live_unit` adapter suite failed.',
              '',
              `Run: ${runUrl}`,
              `Trigger: ${context.eventName}`,
              `Commit: ${context.sha}`,
              '',
              'This suite hits real retailer storefronts, so a failure usually means a',
              'storefront changed its markup and an adapter needs fixing — not that a',
              'test is wrong.',
              '',
              'Triage:',
              '1. Re-sample before concluding a source is dead. One unlucky sample is not a failure.',
              '2. Verify through the runtime adapter, not the endpoint probe alone.',
              '3. Fix the adapter. Do NOT relax an assertion, and never weaken',
              '   `should_cache_price`, `is_price_showable`, or the exact-identity gate.',
              '4. A red run can also mean an expired or depleted vendor key — check the',
              '   Serper lifetime budget counter before assuming markup drift.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'live-suite-failure',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['live-suite-failure'],
            });
