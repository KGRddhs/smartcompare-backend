<!--
  iHerb search-results fixture (GA path) — the page CONTRADICTS ITSELF about its
  currency and the CHOSEN card is silent.

  The NOW Foods card (the one the query selects) declares no currency at all.
  Two sibling cards do declare one, and they DISAGREE: BHD on one, USD on the
  other. That is the shape a mixed-currency storefront/search template produces,
  and it is deliberately the DANGEROUS pair — one of the two codes is the
  storefront currency, so a rung that picks an arbitrary element of the token set
  ships a genuine `local_bhd` stamp half the time.

  "This page says nothing" and "this page says something I cannot read" are
  different states (BLOCKER 4). A document declaring two different currencies is
  the second one, so it must PEND — never fall into the storefront-assumption
  arm, and never consult the document's OpenGraph tags as though it had been
  silent.

  Card markup is the iherb_ga_cards.html shape; only the sibling cards and their
  priceCurrency metas are added.
-->
<html>
<body>
  <div class="products">
    <a data-ga-brand-name="NOW Foods"
       data-ga-discount-price="3.852"
       data-ga-rating="4.8"
       data-ga-review-count="3120"
       title="NOW Foods, Vitamin D-3, 5,000 IU, 120 Softgels"
       href="https://bh.iherb.com/pr/now-foods-vitamin-d-3-5-000-iu-120-softgels/12345">
      <meta itemprop="price" content="3.852" />
      <span>NOW Foods, Vitamin D-3, 5,000 IU, 120 Softgels</span>
    </a>

    <a data-ga-brand-name="California Gold Nutrition"
       data-ga-discount-price="1.565"
       title="California Gold Nutrition, Vitamin D3, 125 mcg (5,000 IU), 90 Softgels"
       href="https://bh.iherb.com/pr/california-gold-nutrition-vitamin-d3-125-mcg/67890">
      <meta itemprop="price" content="1.565" />
      <meta itemprop="priceCurrency" content="BHD" />
      <span>California Gold Nutrition, Vitamin D3, 125 mcg (5,000 IU), 90 Softgels</span>
    </a>

    <a data-ga-brand-name="Solgar"
       data-ga-discount-price="5.049"
       title="Solgar, Vitamin D3 (Cholecalciferol), 5,000 IU, 120 Softgels"
       href="https://bh.iherb.com/pr/solgar-vitamin-d3-cholecalciferol-5000-iu/24680">
      <meta itemprop="price" content="5.049" />
      <meta itemprop="priceCurrency" content="USD" />
      <span>Solgar, Vitamin D3 (Cholecalciferol), 5,000 IU, 120 Softgels</span>
    </a>
  </div>
</body>
</html>
