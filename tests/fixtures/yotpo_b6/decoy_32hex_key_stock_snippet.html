       'Account not found'. It is NOT a 40-char key -> MUST be rejected. -->

  <!-- Plus the stock Shopify theme snippet: the bare 'yotpo' substring must NOT
       be treated as an install signal. -->
  <script>var MetafieldYotpoRating = null; var MetafieldYotpoCount = null;</script>
</head>

</body>
