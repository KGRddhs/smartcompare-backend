<!--
CONSTRUCTED adversarial shape - NOT a byte copy of any cached page.
     Identity and shelf price are www.theperfumeshop.com's real ones (Lacoste Touch
     Of Pink 90ML, offers.price 29.99 GBP). The 24.99 is the EU Omnibus

     decoy, published here in the OTHER schema.org-legal strikethrough shape: a

     is why this defect is invisible in the corpus.
-->
