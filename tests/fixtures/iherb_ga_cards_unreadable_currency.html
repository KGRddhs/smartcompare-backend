<!--
  iHerb search-results fixture — the card declares a currency token that is NOT
  a resolvable ISO 4217 code ("XYZ").

  "This page says nothing" and "this page says something I cannot read" are
  DIFFERENT epistemic states (the BLOCKER-4 lesson written into
  `_currency_label_for`). A price denominated in an unreadable token must pend,
  never ship relabelled as the region currency.
-->
<html>
<body>
  <div class="products">
    <a data-ga-brand-name="NOW Foods"
       data-ga-discount-price="3.852"
       data-ga-rating="4.8"
       data-ga-review-count="3120"
       title="NOW Foods, Vitamin D-3, 5,000 IU, 120 Softgels"
       href="https://bh.iherb.com/pr/now-foods-vitamin-d-3-5-000-iu-120-softgels/12345">
      <meta itemprop="price" content="3.852" />
      <meta itemprop="priceCurrency" content="XYZ" />
      <span>NOW Foods, Vitamin D-3, 5,000 IU, 120 Softgels</span>
    </a>
  </div>
</body>
</html>
