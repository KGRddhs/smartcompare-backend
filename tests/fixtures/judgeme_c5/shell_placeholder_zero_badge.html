<!doctype html>
<html lang="en">
<head>
  <title>Perfume | Shell Placeholder Host</title>
  <script src="https://cdn.judge.me/loader.js"></script>
  <script>jdgm.CDN_HOST='https://cdn.judge.me';</script>
</head>
<body>
  <div id="judgeme_product_reviews" class="jdgm-widget jdgm-review-widget"></div>
  <!-- Pure shell: the only badge is the 0.00 / 0 client-rendered placeholder, and
       zero review bodies. Aggregate must be treated as ABSENT (not a real zero),
       so the enrichment yields NOTHING usable (rating None + reviews []). -->
  <div style='display:none' class='jdgm-prev-badge' data-average-rating='0.00' data-number-of-reviews='0' data-number-of-questions='0'></div>
  <div class='jdgm-rev-widg' data-average-rating='0.00' data-number-of-reviews='0' data-number-of-questions='0'></div>
</body>
</html>
