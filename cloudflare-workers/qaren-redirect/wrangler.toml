name = "qaren-redirect"
main = "src/index.ts"
compatibility_date = "2026-05-12"

# qaren.app/r/{code} → Worker. The custom-domain binding requires that
# `qaren.app` is on Cloudflare DNS (Ahmed already wired this). Run
# `wrangler login` then `wrangler deploy` to publish.
routes = [
  { pattern = "qaren.app/r/*", custom_domain = true },
]

# Logging is fine on the free plan; keep observability cheap.
[observability]
enabled = true
