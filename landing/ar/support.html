<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10B981">
  <meta name="description" content="احصل على الدعم من قارن — راسلنا على support@qaren.app">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=mailto:support@qaren.app">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="canonical" href="https://qaren.app/ar/support">
  <link rel="alternate" hreflang="en" href="https://qaren.app/support">
  <link rel="alternate" hreflang="ar" href="https://qaren.app/ar/support">
  <link rel="alternate" hreflang="x-default" href="https://qaren.app/support">
  <title>الدعم — قارن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald: #10B981;
      --emerald-dark: #059669;
      --ink: #0F172A;
      --slate-500: #64748B;
      --slate-200: #E2E8F0;
      --bg: #FFFFFF;
      --max-width: 560px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      direction: rtl;
      text-align: right;
    }

    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.5rem, 5vw, 3rem);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 3rem;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
      display: grid;
      place-items: center;
    }

    .brand-mark svg {
      width: 20px;
      height: 20px;
      stroke: white;
      stroke-width: 2.5;
      fill: none;
    }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .brand-en {
      font-family: 'Cairo', sans-serif;
      font-weight: 500;
      color: var(--slate-500);
      font-size: 0.95rem;
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 1rem;
    }

    .lede {
      font-size: 1.0625rem;
      color: var(--slate-500);
      margin: 0 0 2rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.875rem 1.5rem;
      background: var(--emerald);
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
    }

    .cta:hover { background: var(--emerald-dark); }
    .cta:active { transform: translateY(1px); }

    .cta svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .note {
      margin: 1.5rem 0 0;
      font-size: 0.875rem;
      color: var(--slate-500);
    }

    .note code, .cta code {
      background: var(--slate-200);
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-size: 0.875em;
      direction: ltr;
      display: inline-block;
    }
    .cta code {
      background: rgba(255,255,255,0.18);
      color: white;
    }

    footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--slate-200);
      width: 100%;
      font-size: 0.8125rem;
      color: var(--slate-500);
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    footer a {
      color: var(--slate-500);
      text-decoration: none;
    }

    footer a:hover { color: var(--ink); }

    .lang-switch {
      margin-right: auto;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #F1F5F9;
        --slate-500: #94A3B8;
        --slate-200: #1E293B;
        --bg: #0F172A;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/ar/">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="5"></circle>
        </svg>
      </div>
      <span class="brand-name">قارن <span class="brand-en" lang="en" dir="ltr">Qaren</span></span>
    </a>

    <h1>تواصل معنا</h1>
    <p class="lede">من المفترض أن يفتح برنامج البريد الإلكتروني لديك الآن. إن لم يحدث ذلك، استخدم الزر أدناه.</p>

    <a class="cta" href="mailto:support@qaren.app">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="m3 7 9 6 9-6"></path>
      </svg>
      راسل <code>support@qaren.app</code>
    </a>

    <p class="note">أو انسخ العنوان: <code>support@qaren.app</code></p>

    <footer>
      <a href="/ar/">&rarr; الرئيسية</a>
      <a href="/ar/privacy.html">الخصوصية</a>
      <a href="/ar/terms.html">الشروط</a>
      <a class="lang-switch" href="/support" lang="en" dir="ltr">English</a>
    </footer>
  </main>
</body>
</html>
